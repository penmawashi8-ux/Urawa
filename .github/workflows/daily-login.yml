name: 毎日自動ログイン

on:
  schedule:
    # GitHub Actions の cron は UTC。JST = UTC+9。
    - cron: '10 15 * * *' # 00:10 JST（日付が変わってすぐ）
    - cron: '0 3 * * *' # 12:00 JST（1 回目が失敗・遅延したときの保険）
  workflow_dispatch: # 手動実行用

concurrency:
  group: urawa-daily-login
  cancel-in-progress: false

permissions:
  contents: write # POINTS.md の更新をコミットするため

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium

      - name: ログイン実行
        env:
          # 2 件目以降は未登録なら自動的にスキップされる
          URAWA_EMAIL: ${{ secrets.URAWA_EMAIL }}
          URAWA_PASSWORD: ${{ secrets.URAWA_PASSWORD }}
          # "_" ありでも無しでも拾えるようにしてある。
          # 番号付きパスワードが無ければ URAWA_PASSWORD を使う（全アカウント同じパスワードの場合）
          URAWA_EMAIL_2: ${{ secrets.URAWA_EMAIL_2 }}
          URAWA_EMAIL2: ${{ secrets.URAWA_EMAIL2 }}
          URAWA_PASSWORD_2: ${{ secrets.URAWA_PASSWORD_2 }}
          URAWA_PASSWORD2: ${{ secrets.URAWA_PASSWORD2 }}
          URAWA_EMAIL_3: ${{ secrets.URAWA_EMAIL_3 }}
          URAWA_EMAIL3: ${{ secrets.URAWA_EMAIL3 }}
          URAWA_PASSWORD_3: ${{ secrets.URAWA_PASSWORD_3 }}
          URAWA_PASSWORD3: ${{ secrets.URAWA_PASSWORD3 }}
        run: npm run login

      # ポイントは POINTS.md に書き出しておき、リポジトリのトップから見えるようにする
      - name: ポイントの更新をコミット
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain POINTS.md data/points.json)" ]; then
            echo "ポイントに変化がないためコミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POINTS.md data/points.json
          git commit -m "chore: ポイントを更新"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # PC がなくても原因が分かるように、失敗時はフォーム構造をログに出しておく
      - name: 失敗時にログインフォームの構造を出力
        if: failure()
        continue-on-error: true
        run: npm run inspect

      - name: 失敗時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshots-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
